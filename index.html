<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>موزیک رندوم</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg-1: #0f0c1d;
    --bg-2: #1a1533;
    --accent: #7c5cff;
    --accent-2: #ff5c9a;
    --text: #f2f0fb;
    --text-dim: #9d97c4;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Vazirmatn, Tahoma, sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-2), var(--bg-1) 60%);
    color: var(--text);
  }
  .app {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .player-card {
    width: 100%; max-width: 380px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }
  .cover {
    width: 220px; height: 220px;
    margin: 0 auto 22px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(124,92,255,0.35);
    overflow: hidden;
    position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover svg { width: 72px; height: 72px; opacity: 0.9; }
  .cover.spinning { animation: spin 8s linear infinite; }
  @keyframes spin { from { filter: brightness(1);} to { filter: brightness(1);} }

  .title { font-size: 19px; font-weight: 700; margin: 4px 0 2px; line-height: 1.5; }
  .performer { font-size: 14px; color: var(--text-dim); margin-bottom: 22px; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 18px; }
  .btn-circle {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: white; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 8px 20px rgba(124,92,255,0.4);
    transition: transform 0.15s ease;
  }
  .btn-circle:active { transform: scale(0.92); }
  .btn-small {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--glass-border);
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .btn-small:active { transform: scale(0.92); }

  .row { display: flex; gap: 12px; margin-top: 6px; }
  .action-btn {
    flex: 1; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--glass-border); background: var(--glass);
    color: var(--text); font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; text-decoration: none;
  }
  .action-btn:active { transform: scale(0.97); }

  .status { margin-top: 16px; font-size: 13px; color: var(--text-dim); min-height: 18px; }
  audio { display: none; }
</style>
</head>
<body>
  <div class="app">
    <div class="player-card">
      <div class="cover" id="cover">
        <svg viewBox="0 0 24 24" fill="white"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <img id="coverImg" style="display:none" />
      </div>
      <div class="title" id="title">برای شروع دکمه‌ی پخش رو بزن</div>
      <div class="performer" id="performer">🎧 موزیک رندوم</div>

      <div class="controls">
        <button class="btn-small" id="btnNext" title="بعدی">⏭</button>
        <button class="btn-circle" id="btnPlay" title="پخش/توقف">▶</button>
        <button class="btn-small" id="btnRandom" title="یکی دیگه">🔀</button>
      </div>

      <div class="row">
        <a class="action-btn" id="btnDownload" href="#" target="_blank" rel="noopener">⬇️ دانلود</a>
      </div>

      <div class="status" id="status"></div>
      <audio id="audio"></audio>
    </div>
  </div>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  const els = {
    cover: document.getElementById('cover'),
    coverImg: document.getElementById('coverImg'),
    title: document.getElementById('title'),
    performer: document.getElementById('performer'),
    btnPlay: document.getElementById('btnPlay'),
    btnNext: document.getElementById('btnNext'),
    btnRandom: document.getElementById('btnRandom'),
    btnDownload: document.getElementById('btnDownload'),
    status: document.getElementById('status'),
    audio: document.getElementById('audio'),
  };

  let current = null;
  let isPlaying = false;

  function setStatus(text) { els.status.textContent = text || ''; }

  function formatTrack(track) {
    els.title.textContent = track.title || 'بدون‌نام';
    els.performer.textContent = track.performer || 'ناشناس';
    els.btnDownload.href = track.download_url;

    if (track.cover_url) {
      els.coverImg.src = track.cover_url;
      els.coverImg.style.display = 'block';
    } else {
      els.coverImg.style.display = 'none';
    }
  }

  async function fetchRandomTrack() {
    setStatus('در حال گرفتن یک آهنگ تصادفی...');
    els.btnPlay.disabled = true;
    try {
      const res = await fetch('/api/random');
      const data = await res.json();
      if (!data.ok) {
        setStatus(data.error === 'no tracks indexed yet'
          ? 'هنوز هیچ آهنگی ایندکس نشده — اول اسکریپت ایندکس‌ساز رو اجرا کن.'
          : 'خطا در دریافت آهنگ.');
        return null;
      }
      current = data;
      formatTrack(data);
      setStatus('');
      return data;
    } catch (e) {
      setStatus('اتصال برقرار نشد. دوباره امتحان کن.');
      return null;
    } finally {
      els.btnPlay.disabled = false;
    }
  }

  async function playNewRandom() {
    isPlaying = false;
    els.btnPlay.textContent = '▶';
    els.cover.classList.remove('spinning');
    const track = await fetchRandomTrack();
    if (track) {
      els.audio.src = track.stream_url;
      togglePlay(true);
    }
  }

  function togglePlay(forcePlay) {
    const shouldPlay = forcePlay !== undefined ? forcePlay : !isPlaying;
    if (!current) { playNewRandom(); return; }

    if (shouldPlay) {
      els.audio.play().catch(() => setStatus('برای پخش، دوباره روی دکمه بزن.'));
      isPlaying = true;
      els.btnPlay.textContent = '⏸';
      els.cover.classList.add('spinning');
    } else {
      els.audio.pause();
      isPlaying = false;
      els.btnPlay.textContent = '▶';
      els.cover.classList.remove('spinning');
    }
  }

  els.btnPlay.addEventListener('click', () => togglePlay());
  els.btnNext.addEventListener('click', playNewRandom);
  els.btnRandom.addEventListener('click', playNewRandom);
  els.audio.addEventListener('ended', playNewRandom);

  // اولین بار خودکار یک آهنگ رو آماده کن (بدون پخش خودکار، چون مرورگرها/تلگرام معمولاً autoplay صدا رو مسدود می‌کنن)
  fetchRandomTrack();
</script>
</body>
</html>
